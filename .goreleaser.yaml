# Build archives and checksums for a release. Run "goreleaser release --clean"
# from a tag; nothing is published by this file alone.
version: 2

project_name: attackscout-agent

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: attackscout-agent
    main: .
    binary: attackscout-agent
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/attackscout/attackscout-agent/internal/cli.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - README.fr.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  draft: true
